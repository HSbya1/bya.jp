<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BY/Λ</title>

  <style>
    body {
      margin: 0;
      padding: 60px 24px;
      font-family: "Inter", Helvetica, Arial, sans-serif;
      font-weight: 500;
      background: #ffffff;
      color: #111111;
      line-height: 1.6;
    }

    .container {
      max-width: 720px;
    }

    h1 {
      font-size: 50px;
      font-weight: 500;
      margin-bottom: 48px;
      letter-spacing: -0.04em;
    }

    p {
      font-size: 16px;
      margin-bottom: 24px;
    }

    img {
      width: 100%;
      margin: 48px 0;
      display: block;
    }

    a {
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid #111;
      padding-bottom: 2px;
      margin-right: 16px;
    }

    a:hover {
      opacity: 0.7;
    }
    .slider {
  position: relative;
  width: 100%;
  height: 420px; /* 必要なら調整 */
  margin: 48px 0;
  overflow: hidden;
}

.slider img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  animation: fade 9s infinite;
}

/* 画像の枚数分だけ delay をずらす */
.slider img:nth-child(1) { animation-delay: 0s; }
.slider img:nth-child(2) { animation-delay: 3s; }
.slider img:nth-child(3) { animation-delay: 6s; }

@keyframes fade {
  0% { opacity: 0; }
  10% { opacity: 1; }
  30% { opacity: 1; }
  40% { opacity: 0; }
  100% { opacity: 0; }
}
  </style>
</head>

<body>
  <div class="container">

    <h1>BY/Λ</h1>

    <p>
      Furniture / FFE / Objects
    </p>

    <p>
      Curated materials, products, and spatial elements
      for hospitality and architecture .
    </p>
    
<p>
  <a 
    href="https://maps.app.goo.gl/tPj5szSJ1k8FwDGw5"
    style="border:none;"
    target="_blank"
  >
    Nihonbashi Office　/　TOKYO
  </a>
</p>


    <p>
      <a href="https://instagram.com/">Instagram</a>
      <a href="https://tally.so/r/Gx540e">Contact</a>
    </p>
  </p>
    
  <div class="slider">
    <img src="images/1.jpg" />
    <img src="images/2.jpg" />
    <img src="images/3.jpg" />
  </div>
    
  </p>
    
  </div>
</body>
</html>
