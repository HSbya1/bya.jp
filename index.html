<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>BY／Λ — Interior, Furniture & FFE</title>

  <meta
    name="description"
    content="BY／Λは、家具・備品の選定、スタイリング、空間設計を横断し、商業空間・宿泊施設の体験を一貫して整えるデザインスタジオです。"
  />

  <link rel="icon" type="image/jpeg" href="icon-jpg.jpg" />

  <style>
    :root {
      --background: #f5f5f2;
      --text: #111111;
      --muted: #777777;
      --page-padding-x: clamp(24px, 5vw, 76px);
      --page-padding-y: clamp(28px, 6vh, 64px);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--background);
    }

    body {
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Inter",
        Arial,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    a {
      color: inherit;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 620px;
      overflow: hidden;
      isolation: isolate;
      background: var(--background);
    }

    /*
      右側の写真
      画面全体の約62%を使用し、
      左側へ少し入り込ませています。
    */
    .hero-image {
      position: absolute;
      z-index: 1;
      top: 0;
      right: 0;
      width: 64%;
      height: 100%;
      overflow: hidden;
      background: #ddddda;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transform: scale(1.02);
      animation: image-in 1.3s var(--ease) both;
    }

    /*
      写真左側をわずかに明るくし、
      前面の文字を読みやすくします。
    */
    .hero-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(245, 245, 242, 0.88) 0%,
          rgba(245, 245, 242, 0.36) 18%,
          rgba(245, 245, 242, 0) 44%
        );
      pointer-events: none;
    }

    /*
      左側の文字
      写真より前面に置きます。
    */
    .content {
      position: relative;
      z-index: 2;
      width: min(520px, 45vw);
      height: 100%;
      padding:
        var(--page-padding-y)
        0
        clamp(28px, 4vh, 44px)
        var(--page-padding-x);

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      animation: content-in 0.9s var(--ease) both;
    }

    .brand {
      margin: 0;
      font-size: clamp(42px, 4.2vw, 66px);
      line-height: 0.95;
      font-weight: 300;
      letter-spacing: -0.055em;
    }

    .main-copy {
      margin-top: clamp(54px, 11vh, 118px);
    }

    .main-copy h1 {
      margin: 0;
      max-width: 520px;
      font-size: clamp(36px, 3.25vw, 52px);
      line-height: 1.04;
      font-weight: 500;
      letter-spacing: -0.052em;
    }

    .lead {
      margin: 26px 0 0;
      max-width: 390px;
      font-size: 14px;
      line-height: 1.75;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .lead-en {
      display: block;
      margin-bottom: 11px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /*
      Start a project ボタン
    */
    .primary-button {
      position: relative;
      margin-top: 30px;
      width: 226px;
      height: 54px;
      padding: 0 20px 0 23px;

      display: inline-flex;
      align-items: center;
      justify-content: space-between;

      overflow: hidden;
      border-radius: 999px;
      background: #080808;
      color: #ffffff;
      text-decoration: none;

      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;

      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.1);

      transition:
        transform 280ms var(--ease),
        box-shadow 280ms var(--ease),
        color 280ms ease;
    }

    /*
      ホバー時に白い面が左から広がります。
    */
    .primary-button::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      border-radius: inherit;
      background: #ffffff;
      transform: translateX(-102%);
      transition: transform 420ms var(--ease);
    }

    .primary-button span {
      position: relative;
      z-index: 1;
    }

    .primary-button .arrow {
      font-size: 18px;
      line-height: 1;
      transition: transform 300ms var(--ease);
    }

    .primary-button:hover {
      color: #111111;
      transform: translateY(-2px);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.15);
    }

    .primary-button:hover::before {
      transform: translateX(0);
    }

    .primary-button:hover .arrow {
      transform: translate(3px, -3px);
    }

    .primary-button:active {
      transform: translateY(0);
    }

    .links {
      margin-top: 20px;
      display: grid;
      gap: 8px;
    }

    .links a,
    .powered {
      width: max-content;
      max-width: 100%;
      color: var(--muted);
      text-decoration: none;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;
      transition:
        color 180ms ease,
        opacity 180ms ease;
    }

    .links a:hover,
    .powered:hover {
      color: var(--text);
    }

    .links .link-arrow,
    .powered .link-arrow {
      display: inline-block;
      margin-left: 4px;
      transition: transform 220ms var(--ease);
    }

    .links a:hover .link-arrow,
    .powered:hover .link-arrow {
      transform: translateX(3px);
    }

    .powered {
      margin-top: auto;
    }

    @keyframes content-in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes image-in {
      from {
        opacity: 0;
        transform: scale(1.07);
      }

      to {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    /*
      タブレット
    */
    @media (max-width: 960px) {
      .hero-image {
        width: 61%;
      }

      .content {
        width: 52vw;
      }

      .main-copy {
        margin-top: clamp(48px, 8vh, 82px);
      }

      .main-copy h1 {
        font-size: clamp(34px, 4.5vw, 46px);
      }
    }

    /*
      スマートフォン
      1画面を維持しながら、写真を全面背景にします。
    */
    @media (max-width: 680px) {
      .hero {
        min-height: 640px;
      }

      .hero-image {
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .hero-image img {
        object-position: 62% center;
      }

      .hero-image::after {
        background:
          linear-gradient(
            90deg,
            rgba(245, 245, 242, 0.97) 0%,
            rgba(245, 245, 242, 0.86) 45%,
            rgba(245, 245, 242, 0.16) 100%
          ),
          linear-gradient(
            0deg,
            rgba(245, 245, 242, 0.8) 0%,
            rgba(245, 245, 242, 0) 42%
          );
      }

      .content {
        width: 100%;
        padding:
          28px
          22px
          calc(24px + env(safe-area-inset-bottom))
          22px;
      }

      .brand {
        font-size: 44px;
      }

      .main-copy {
        margin-top: clamp(54px, 11vh, 88px);
      }

      .main-copy h1 {
        max-width: 340px;
        font-size: clamp(34px, 10vw, 44px);
        line-height: 1.03;
      }

      .lead {
        max-width: 315px;
        margin-top: 22px;
        font-size: 13px;
        line-height: 1.7;
      }

      .primary-button {
        margin-top: 25px;
        width: min(226px, 100%);
      }

      .links {
        margin-top: 17px;
      }
    }

    /*
      高さが低いノートPC用
    */
    @media (max-height: 720px) and (min-width: 681px) {
      .content {
        padding-top: 34px;
        padding-bottom: 25px;
      }

      .brand {
        font-size: 48px;
      }

      .main-copy {
        margin-top: 44px;
      }

      .main-copy h1 {
        font-size: 38px;
      }

      .lead {
        margin-top: 18px;
        line-height: 1.6;
      }

      .primary-button {
        margin-top: 20px;
        height: 50px;
      }

      .links {
        margin-top: 14px;
        gap: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="hero">

    <div class="hero-image" aria-hidden="true">
      <img src="image.jpg" alt="" />
    </div>

    <section class="content">
      <div class="brand">BY／Λ</div>

      <div class="main-copy">
        <h1>
          Objects and space,<br />
          composed as one.
        </h1>

        <p class="lead">
          <span class="lead-en">
            Interior design, furniture sourcing and spatial direction.
          </span>

          家具・備品の選定から、スタイリング、空間設計まで。<br />
          商業空間や宿泊施設の体験を、一貫して整えます。
        </p>

        <a
          class="primary-button"
          href="https://tally.so/r/Gx540e"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>Start a project</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <nav class="links" aria-label="Information">
          <a
            href="https://www.instagram.com/shojijiii/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Founder / Director: Hiro Shoji
            <span class="link-arrow">→</span>
          </a>

          <a
            href="https://maps.app.goo.gl/tPj5szSJ1k8FwDGw5"
            target="_blank"
            rel="noopener noreferrer"
          >
            Office / Nihonbashi, Tokyo
            <span class="link-arrow">→</span>
          </a>
        </nav>
      </div>

      <a
        class="powered"
        href="https://attracta.co.jp/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Powered by ΛTTRACTΛ inc.
        <span class="link-arrow">→</span>
      </a>
    </section>

  </main>
</body>
</html>
