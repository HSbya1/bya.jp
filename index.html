<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>BY／Λ — Interior, Furniture & FFE</title>

  <meta
    name="description"
    content="BY／Λは、家具・アート・備品の選定、調達、空間のスタイリングを通して、オフィスや商業空間、宿泊施設の体験を一貫して整えるデザインスタジオです。"
  />

  <link rel="icon" type="image/jpeg" href="icon-jpg.jpg" />

  <style>
    :root {
      --background: #ffffff;
      --text: #111111;
      --muted: #777777;

      --page-padding-x: clamp(24px, 5vw, 76px);
      --page-padding-y: clamp(28px, 6vh, 64px);

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--background);
    }

    body {
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Inter",
        Arial,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    a {
      color: inherit;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 620px;
      overflow: hidden;
      isolation: isolate;
      background: var(--background);
    }

    /*
      右側のメイン画像
    */
    .hero-image {
      position: absolute;
      z-index: 1;
      top: 0;
      right: 0;

      width: 64%;
      height: 100%;

      overflow: hidden;
      background: #ececec;
    }

    .hero-image img {
      display: block;
      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      transform: scale(1.02);

      animation:
        image-in
        1.3s
        var(--ease)
        both;
    }

    /*
      画像左端のグラデーション
    */
    .hero-image::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.92) 0%,
          rgba(255, 255, 255, 0.56) 14%,
          rgba(255, 255, 255, 0.12) 35%,
          rgba(255, 255, 255, 0) 50%
        );

      pointer-events: none;
    }

    /*
      左側コンテンツ
    */
    .content {
      position: relative;
      z-index: 2;

      width: min(580px, 49vw);
      height: 100%;

      padding:
        var(--page-padding-y)
        0
        clamp(28px, 4vh, 44px)
        var(--page-padding-x);

      display: flex;
      flex-direction: column;
      align-items: flex-start;

      animation:
        content-in
        0.9s
        var(--ease)
        both;
    }

    /*
      BY／Λ ロゴ
    */
    .brand {
      margin: 0;
      line-height: 0;
    }

    .brand-logo {
      display: block;

      width: clamp(240px, 21.5vw, 330px);
      max-width: 100%;
      height: auto;

      object-fit: contain;
      object-position: left center;
    }

    /*
      コピー部分
    */
    .main-copy {
      margin-top: clamp(48px, 9.5vh, 100px);
    }

    .main-copy h1 {
      max-width: 540px;
      margin: 0;

      font-size: clamp(36px, 3.15vw, 50px);
      line-height: 1.08;
      font-weight: 500;
      letter-spacing: -0.045em;
    }

    .main-copy h1 .line {
      display: block;
    }

    .main-copy h1 .line + .line {
      margin-top: 8px;
    }

    .lead {
      max-width: 370px;
      margin: 24px 0 0;

      font-size: 13px;
      line-height: 1.68;
      font-weight: 400;
      letter-spacing: 0.01em;
    }

    .lead-en {
      display: block;
      margin-bottom: 11px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.55;
      letter-spacing: 0.01em;
    }

    /*
      Start a project ボタン
    */
    .primary-button {
      position: relative;

      width: 226px;
      height: 54px;
      margin-top: 30px;
      padding: 0 20px 0 23px;

      display: inline-flex;
      align-items: center;
      justify-content: space-between;

      overflow: hidden;

      border-radius: 999px;
      background: #080808;
      color: #ffffff;

      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;

      box-shadow:
        0
        10px
        28px
        rgba(0, 0, 0, 0.1);

      transition:
        transform 280ms var(--ease),
        box-shadow 280ms var(--ease),
        color 280ms ease;
    }

    .primary-button::before {
      content: "";

      position: absolute;
      z-index: 0;
      inset: 0;

      border-radius: inherit;
      background: #ffffff;

      transform: translateX(-102%);

      transition:
        transform
        420ms
        var(--ease);
    }

    .primary-button span {
      position: relative;
      z-index: 1;
    }

    .primary-button .arrow {
      font-size: 18px;
      line-height: 1;

      transition:
        transform
        300ms
        var(--ease);
    }

    .primary-button:hover {
      color: #111111;

      transform: translateY(-2px);

      box-shadow:
        0
        16px
        38px
        rgba(0, 0, 0, 0.15);
    }

    .primary-button:hover::before {
      transform: translateX(0);
    }

    .primary-button:hover .arrow {
      transform: translate(3px, -3px);
    }

    .primary-button:active {
      transform: translateY(0);
    }

    /*
      Founder / Office
    */
    .links {
      display: grid;
      gap: 8px;

      margin-top: 20px;
    }

    .links a,
    .powered {
      width: max-content;
      max-width: 100%;

      color: var(--muted);

      text-decoration: none;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 400;

      transition:
        color 180ms ease,
        opacity 180ms ease;
    }

    .links a:hover,
    .powered:hover {
      color: var(--text);
    }

    .links .link-arrow,
    .powered .link-arrow {
      display: inline-block;
      margin-left: 4px;

      transition:
        transform
        220ms
        var(--ease);
    }

    .links a:hover .link-arrow,
    .powered:hover .link-arrow {
      transform: translateX(3px);
    }

    /*
      左下のATTRACTAリンク
    */
    .powered {
      margin-top: auto;
    }

    /*
      初期表示アニメーション
    */
    @keyframes content-in {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes image-in {
      from {
        opacity: 0;
        transform: scale(1.07);
      }

      to {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    /*
      タブレット
    */
    @media (max-width: 960px) {
      .hero-image {
        width: 61%;
      }

      .content {
        width: 55vw;
      }

      .brand-logo {
        width: clamp(230px, 29vw, 295px);
      }

      .main-copy {
        margin-top: clamp(44px, 7.5vh, 74px);
      }

      .main-copy h1 {
        font-size: clamp(34px, 4.2vw, 45px);
      }
    }

    /*
      スマートフォン
    */
    @media (max-width: 680px) {
      .hero {
        min-height: 640px;
      }

      .hero-image {
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .hero-image img {
        object-position: 62% center;
      }

      .hero-image::after {
        background:
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.97) 0%,
            rgba(255, 255, 255, 0.88) 42%,
            rgba(255, 255, 255, 0.28) 77%,
            rgba(255, 255, 255, 0.08) 100%
          ),
          linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.82) 0%,
            rgba(255, 255, 255, 0) 44%
          );
      }

      .content {
        width: 100%;

        padding:
          28px
          22px
          calc(24px + env(safe-area-inset-bottom))
          22px;
      }

      .brand-logo {
        width: 245px;
        max-width: 76vw;
      }

      .main-copy {
        margin-top: clamp(46px, 8.5vh, 70px);
      }

      .main-copy h1 {
        max-width: 340px;

        font-size: clamp(33px, 9.4vw, 42px);
        line-height: 1.08;
      }

      .main-copy h1 .line + .line {
        margin-top: 6px;
      }

      .lead {
        max-width: 300px;
        margin-top: 20px;

        font-size: 12.5px;
        line-height: 1.65;
      }

      .lead-en {
        font-size: 11.5px;
      }

      .primary-button {
        width: min(226px, 100%);
        margin-top: 24px;
      }

      .links {
        margin-top: 17px;
      }
    }

    /*
      高さが低いPC
    */
    @media (max-height: 720px) and (min-width: 681px) {
      .content {
        padding-top: 30px;
        padding-bottom: 25px;
      }

      .brand-logo {
        width: 250px;
      }

      .main-copy {
        margin-top: 30px;
      }

      .main-copy h1 {
        font-size: 38px;
        line-height: 1.1;
      }

      .main-copy h1 .line + .line {
        margin-top: 6px;
      }

      .lead {
        margin-top: 18px;
        font-size: 12.5px;
        line-height: 1.6;
      }

      .primary-button {
        height: 50px;
        margin-top: 20px;
      }

      .links {
        gap: 5px;
        margin-top: 14px;
      }
    }

    /*
      アニメーション軽減設定
    */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="hero">

    <div class="hero-image" aria-hidden="true">
      <img src="image.jpg" alt="" />
    </div>

    <section class="content">

      <div class="brand">
        <img
          class="brand-logo"
          src="bya-logo.png"
          alt="BY／Λ"
        />
      </div>

      <div class="main-copy">

        <h1>
          <span class="line">Objects and space,</span>
          <span class="line">composed as one.</span>
        </h1>

        <p class="lead">
          <span class="lead-en">
            Furniture, art and object sourcing, procurement and spatial styling.
          </span>

          家具・アート・備品の選定、調達、空間のスタイリングまで。<br />
          オフィスや商業空間、宿泊施設の体験を、一貫して整えます。
        </p>

        <a
          class="primary-button"
          href="https://tally.so/r/Gx540e"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>Start a project / conntact</span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>

        <nav class="links" aria-label="Information">

          <a
            href="https://www.instagram.com/shojijiii/"
            target="_blank"
            rel="noopener noreferrer"
          >
            Founder / Director: Hiro Shoji
            <span class="link-arrow">→</span>
          </a>

          <a
            href="https://maps.app.goo.gl/tPj5szSJ1k8FwDGw5"
            target="_blank"
            rel="noopener noreferrer"
          >
            Office / Nihonbashi, Tokyo
            <span class="link-arrow">→</span>
          </a>

        </nav>
      </div>

      <a
        class="powered"
        href="https://attracta.co.jp/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Powered by ΛTTRACTΛ inc.
        <span class="link-arrow">→</span>
      </a>

    </section>
  </main>
</body>
</html>
